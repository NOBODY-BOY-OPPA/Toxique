<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>TOXIQUE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff2d55'/></svg>">
<style>
:root{
  --bg:#08080a; --panel:#111115; --panel2:#17171d; --line:#26262e;
  --text:#f2f2f5; --muted:#8b8b98; --red:#ff2d55; --red2:#ff6a3d; --glow:rgba(255,45,85,.35);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
body{display:flex;justify-content:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(600px 300px at 50% -10%,rgba(255,45,85,.22),transparent 70%),
  radial-gradient(500px 300px at 100% 100%,rgba(255,106,61,.10),transparent 70%);pointer-events:none}
.app{position:relative;width:100%;max-width:720px;height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t)}
header{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:900;letter-spacing:.05em;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 0 24px var(--glow)}
.logo h1{font-size:20px;letter-spacing:.22em;font-weight:900}
.logo small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;margin-top:2px}
.icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer}
.icon-btn:active{transform:scale(.94)}
#chat{flex:1;overflow-y:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:0}
.hero{margin:auto 0;text-align:center;padding:10px 6px}
.hero h2{font-size:26px;margin:10px 0 6px;font-weight:800;line-height:1.15}
.hero h2 span{background:linear-gradient(90deg,var(--red),var(--red2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 18px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--red);box-shadow:0 0 16px var(--glow)}
.msg{max-width:92%;animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end}
.msg.bot{align-self:flex-start;width:100%}
.bubble{background:linear-gradient(135deg,var(--red),var(--red2));padding:11px 15px;border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;box-shadow:0 6px 24px rgba(255,45,85,.25)}
.bubble img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sec{padding:13px 15px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.sec:last-child{border-bottom:0}
.tag{display:block;font-size:10.5px;letter-spacing:.16em;font-weight:800;color:var(--muted);margin-bottom:6px}
.sec.reply{background:linear-gradient(180deg,rgba(255,45,85,.10),rgba(255,45,85,.03))}
.sec.reply .tag{color:var(--red)}
.reply-text{font-size:17px;font-weight:700;line-height:1.4;color:#fff}
.copy{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--red),var(--red2));border:0;color:#fff;font-weight:800;font-size:13px;padding:10px 16px;border-radius:12px;cursor:pointer;box-shadow:0 4px 18px var(--glow)}
.copy:active{transform:scale(.96)}
.sec.fx{background:var(--panel2)}
.plain{background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:18px;white-space:pre-wrap;font-size:14.5px;line-height:1.5}
.typing{display:flex;gap:5px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;width:max-content}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:b 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
footer{padding:8px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:rgba(8,8,10,.85);backdrop-filter:blur(10px)}
#preview{display:none;align-items:center;gap:10px;margin-bottom:8px}
#preview img{height:54px;border-radius:10px;border:1px solid var(--line)}
#preview button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;cursor:pointer}
.row{display:flex;gap:8px;align-items:flex-end}
.row .icon-btn{flex:none;width:46px;height:46px;font-size:19px}
textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:13px 14px;font:inherit;font-size:16px;max-height:130px;outline:none}
textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,45,85,.15)}
#send{flex:none;width:46px;height:46px;border-radius:14px;border:0;font-size:19px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 4px 18px var(--glow)}
#send:disabled{opacity:.45}
#send:active{transform:scale(.94)}
.hint{text-align:center;color:#5d5d69;font-size:10.5px;margin-top:7px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="mark">TX</div>
      <div><h1>TOXIQUE</h1><small>CHARISME - CADRE - DETACHEMENT</small></div>
    </div>
    <button class="icon-btn" id="reset" title="Nouvelle discussion">X</button>
  </header>

  <main id="chat"></main>

  <footer>
    <div id="preview"><img id="prevImg" alt=""><button id="prevX">Retirer</button></div>
    <div class="row">
      <button class="icon-btn" id="attach" title="Envoyer une capture">+</button>
      <input type="file" id="file" accept="image/*" hidden>
      <textarea id="input" rows="1" placeholder="Elle t'a dit quoi ?"></textarea>
      <button id="send" title="Envoyer">></button>
    </div>
    <div class="hint">Colle une capture d'ecran ou ecris ta situation.</div>
  </footer>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var chat = $("chat"), input = $("input"), sendBtn = $("send"),
      fileIn = $("file"), preview = $("preview"), prevImg = $("prevImg");

  var STORE = "toxique_v1";
  var messages = [];
  var pendingImage = null;
  var busy = false;

  try { messages = JSON.parse(localStorage.getItem(STORE) || "[]").map(function (m) { return { role: m.role, text: m.text, image: null }; }); } catch (e) { messages = []; }

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify(messages.slice(-40).map(function (m) { return { role: m.role, text: m.text }; })));
    } catch (e) {}
  }

  var SUGGESTIONS = [
    "Elle m'a laisse en vu depuis hier",
    "Elle dit qu'elle est trop occupee",
    "Comment l'aborder en soiree ?",
    "Relancer sans paraitre en manque",
    "Elle me teste avec un \"t'es sur de toi ?\""
  ];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function parseReply(t) {
    var a = t.match(/\[ANALYSE[^\]]*\]([\s\S]*?)(?=\[R[ÉE]PONSE|$)/i);
    var r = t.match(/\[R[ÉE]PONSE[^\]]*\]([\s\S]*?)(?=\[L.EFFET|$)/i);
    var e = t.match(/\[L.EFFET[^\]]*\]([\s\S]*)$/i);
    if (!r) return null;
    var clean = function (s) { return (s || "").replace(/^[\s-]+|[\s-]+$/g, "").trim(); };
    var quote = clean(r[1]).replace(/^["\u201c\u00ab\s]+|["\u201d\u00bb\s]+$/g, "");
    return { analysis: clean(a && a[1]), reply: quote, effect: clean(e && e[1]) };
  }

  function renderBot(text) {
    var wrap = el("div", "msg bot");
    var p = parseReply(text);
    if (!p) { wrap.appendChild(el("div", "plain", text)); return wrap; }
    var card = el("div", "card");
    if (p.analysis) {
      var s = el("div", "sec");
      s.appendChild(el("span", "tag", "ANALYSE STRATEGIQUE"));
      s.appendChild(document.createTextNode(p.analysis));
      card.appendChild(s);
    }
    var s2 = el("div", "sec reply");
    s2.appendChild(el("span", "tag", "REPONSE TOXIQUE - A COPIER-COLLER"));
    s2.appendChild(el("div", "reply-text", "\u201c" + p.reply + "\u201d"));
    var cp = el("button", "copy", "Copier");
    cp.onclick = function () {
      var done = function () { cp.textContent = "Copie"; setTimeout(function () { cp.textContent = "Copier"; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(p.reply).then(done, done);
      } else {
        var ta = el("textarea");
        ta.value = p.reply;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        ta.remove();
        done();
      }
    };
    s2.appendChild(cp);
    card.appendChild(s2);
    if (p.effect) {
      var s3 = el("div", "sec fx");
      s3.appendChild(el("span", "tag", "L'EFFET RECHERCHE"));
      s3.appendChild(document.createTextNode(p.effect));
      card.appendChild(s3);
    }
    wrap.appendChild(card);
    return wrap;
  }

  function renderUser(m) {
    var wrap = el("div", "msg user");
    var b = el("div", "bubble");
    if (m.image) { var im = new Image(); im.src = m.image; b.appendChild(im); }
    if (m.text) b.appendChild(document.createTextNode(m.text));
    wrap.appendChild(b);
    return wrap;
  }

  function renderAll() {
    chat.innerHTML = "";
    if (!messages.length) {
      var h = el("div", "hero");
      var title = el("h2");
      title.innerHTML = "Elle t'a repondu ?<br><span>Reponds mieux.</span>";
      h.appendChild(title);
      var p = el("p", null, "Balance sa capture ou raconte la situation. Tu repars avec la replique exacte, courte et qui frappe.");
      h.appendChild(p);
      var c = el("div", "chips");
      SUGGESTIONS.forEach(function (s) {
        var b = el("button", "chip", s);
        b.onclick = function () { input.value = s; input.focus(); autoGrow(); };
        c.appendChild(b);
      });
      h.appendChild(c);
      chat.appendChild(h);
      return;
    }
    messages.forEach(function (m) {
      chat.appendChild(m.role === "user" ? renderUser(m) : renderBot(m.text));
    });
    scrollEnd();
  }

  function scrollEnd() {
    requestAnimationFrame(function () { chat.scrollTo({ top: chat.scrollHeight }); });
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
  }

  function setPending(dataUrl) {
    pendingImage = dataUrl;
    if (dataUrl) { prevImg.src = dataUrl; preview.style.display = "flex"; }
    else { preview.style.display = "none"; }
  }

  function resizeImage(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var MAX = 1280;
          var k = Math.min(1, MAX / Math.max(img.width, img.height));
          var c = document.createElement("canvas");
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.8));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function handleFile(f) {
    if (!f || !f.type || f.type.indexOf("image/") !== 0) return;
    resizeImage(f).then(setPending, function () {});
  }

  function callApi(payload) {
    var DELAYS = [0, 1200, 2500, 4000];
    var attempt = function (i) {
      if (i >= DELAYS.length) return Promise.resolve(null);
      var wait = DELAYS[i] ? new Promise(function (r) { setTimeout(r, DELAYS[i]); }) : Promise.resolve();
      return wait.then(function () {
        return fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(function (r) {
          if (r.ok) {
            return r.json().then(function (j) {
              if (j && j.text) return j.text;
              return attempt(i + 1);
            }, function () { return attempt(i + 1); });
          }
          if (r.status === 400 || r.status === 413) return null;
          return attempt(i + 1);
        }, function () { return attempt(i + 1); });
      });
    };
    return attempt(0);
  }

  function send() {
    if (busy) return;
    var text = input.value.trim();
    if (!text && !pendingImage) return;
    busy = true;
    sendBtn.disabled = true;

    messages.push({ role: "user", text: text, image: pendingImage });
    input.value = "";
    autoGrow();
    setPending(null);
    renderAll();

    var typing = el("div", "typing");
    typing.innerHTML = "<i></i><i></i><i></i>";
    chat.appendChild(typing);
    scrollEnd();

    var payload = {
      messages: messages.slice(-24).map(function (m) {
        return { role: m.role, text: m.text, image: m.image || null };
      })
    };

    callApi(payload).then(function (out) {
      typing.remove();
      if (out) messages.push({ role: "assistant", text: out });
      else messages.push({ role: "assistant", text: "Connexion instable. Renvoie ton message, je suis la." });
      save();
      renderAll();
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    });
  }

  sendBtn.onclick = send;

  input.addEventListener("input", autoGrow);

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) {
      e.preventDefault();
      send();
    }
  });

  input.addEventListener("paste", function (e) {
    var items = (e.clipboardData && e.clipboardData.items) ? Array.prototype.slice.call(e.clipboardData.items) : [];
    var it = items.filter(function (i) { return i.type && i.type.indexOf("image/") === 0; })[0];
    if (it) { e.preventDefault(); handleFile(it.getAsFile()); }
  });

  $("attach").onclick = function () { fileIn.click(); };

  fileIn.onchange = function () { handleFile(fileIn.files[0]); fileIn.value = ""; };

  $("prevX").onclick = function () { setPending(null); };

  $("reset").onclick = function () {
    if (!messages.length || confirm("Effacer la discussion ?")) {
      messages = [];
      save();
      setPending(null);
      renderAll();
    }
  };

  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  renderAll();
})();
</script>
</body>
</html>
